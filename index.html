<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prumo – Cronograma de estudos</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238FB8E8'/%3E%3Cstop offset='1' stop-color='%235F8BD4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='22' y='10' width='4' height='12' rx='2' fill='%23fff'/%3E%3Crect x='38' y='10' width='4' height='12' rx='2' fill='%23fff'/%3E%3Crect x='14' y='17' width='36' height='34' rx='8' fill='%23fff'/%3E%3Cpath d='M14 29h36' stroke='%23D8E5F7' stroke-width='2.5'/%3E%3Cpath d='M24 40l5.5 5.5L41 34' fill='none' stroke='%235F8BD4' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8FB;--surface:#fff;--ink:#1F2733;--muted:#6A7586;--line:#E4E9F0;--accent:#5F8BD4;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A2029;--ink:#E8ECF2;--muted:#9AA5B5;--line:#2A323E;--accent:#8CB1F0}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A2029;--ink:#E8ECF2;--muted:#9AA5B5;--line:#2A323E;--accent:#8CB1F0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;align-items:center;gap:12px;margin-bottom:36px}
header svg{width:40px;height:40px;flex:none}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0;margin-top:2px}
h1{font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.1;font-weight:600;letter-spacing:-.025em;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 24px;max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px}
.dates{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500}
input[type=date]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:150px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#sum{font-size:.9rem;color:var(--muted);padding-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.85rem;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
#msg{font-size:.8rem;color:var(--muted);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:22px 0 4px;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.week{margin-top:28px}
.week h2{font-size:.95rem;font-weight:600;color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;align-content:start}
.day.today{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.dh{display:flex;align-items:center;gap:10px}
.num{font-size:1.9rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.wd{font-size:.82rem;color:var(--muted);line-height:1.25}
.tag{margin-left:auto;max-width:52%;text-align:center;font-size:.72rem;font-weight:600;line-height:1.25;padding:4px 9px;border-radius:99px;color:color-mix(in srgb,var(--c) 65%,var(--ink));background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.rows{display:grid;gap:6px}
.r{display:grid;grid-template-columns:82px 1fr 22px;gap:8px;font-size:.85rem;line-height:1.35;padding:8px 10px;border-radius:10px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.t{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums;padding-top:1px}
.gym{--c:#5FA67A}.home{--c:#D9A441}.study{--c:#6C93D6}.work{--c:#8E7BD0}.prep{--c:#D98AA6}.uni{--c:#E39A6D}.review{--c:#4FAFB0}.free{--c:#9AA3B2}.exam{--c:#D9534F}.due{--c:#D9A441}
.eb{margin-left:auto;font:inherit;font-size:.75rem;color:var(--muted);background:none;border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer}.tag+.eb{margin-left:0}.eb:hover{color:var(--ink);border-color:var(--accent)}
.edited .num::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:super}
dialog{width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(20,28,40,.35)}
.df{display:grid;gap:12px;padding:20px;margin:0}.df h3{margin:0;font-size:1.1rem;font-weight:600}
.er{display:grid;grid-template-columns:104px 1fr 108px 34px;gap:6px}
.er input,.er select,.df select{font:inherit;font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0;width:100%}
.btn{font:inherit;font-size:.85rem;font-weight:500;border-radius:10px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.p{background:color-mix(in srgb,var(--accent) 80%,var(--ink));border-color:transparent;color:var(--surface)}
.er .btn{padding:6px 0}.fa{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.ck{width:20px;height:20px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 70%,var(--surface));background:var(--surface);cursor:pointer;padding:0;position:relative;margin-top:1px}
.ck[aria-pressed=true]{background:var(--c);border-color:var(--c)}
.ck[aria-pressed=true]::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.done{opacity:.75}.done>span:not(.t){text-decoration:line-through;color:var(--muted)}
.bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
@media (max-width:480px){.er{grid-template-columns:96px 1fr 34px}.er select{grid-column:1/3}}
@media (max-width:480px){.wrap{padding:20px 14px 48px}.dates label,input[type=date]{width:100%}.dates label{flex:1 1 140px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<svg viewBox="0 0 64 64" role="img" aria-label="Logo Prumo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FB8E8"/><stop offset="1" stop-color="#5F8BD4"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><rect x="22" y="10" width="4" height="12" rx="2" fill="#fff"/><rect x="38" y="10" width="4" height="12" rx="2" fill="#fff"/><rect x="14" y="17" width="36" height="34" rx="8" fill="#fff"/><path d="M14 29h36" stroke="#D8E5F7" stroke-width="2.5"/><path d="M24 40l5.5 5.5L41 34" fill="none" stroke="#5F8BD4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="brand">Prumo<small>Cronograma de estudos</small></div>
</header>

<h1>Sua rotina, dia a dia</h1>
<p class="sub">Escolha o período que quer ver e use Editar em qualquer dia para mudar horários, atividades e observações. Marque o círculo de cada bloco para registrar o que foi feito.</p>

<section class="panel" aria-label="Período">
<div class="dates">
<label>De<input type="date" id="de"></label>
<label>Até<input type="date" id="ate"></label>
<div id="sum" aria-live="polite"></div>
</div>
<div class="chips" id="chips"></div>
<p id="msg"></p>
</section>

<div class="legend">
<span class="gym">Academia</span><span class="home">Casa</span><span class="study">Estudos</span><span class="work">Trabalho</span><span class="prep">Me arrumar</span><span class="uni">Faculdade</span><span class="review">Revisão</span><span class="exam">Prova</span><span class="due">Entrega</span>
</div>

<main id="out"></main>
<dialog id="dlg"></dialog>
</div>

<script>
(function(){
var WD=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
var MO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var p2=function(n){return String(n).padStart(2,"0")};
var iso=function(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
var parse=function(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
var add=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var fmt=function(d){return p2(d.getDate())+"/"+p2(d.getMonth()+1)};
var $=function(s){return document.querySelector(s)};

var G=["7h30–8h30","Academia","gym"],H=["8h30–9h30","Afazeres de casa","home"],W=["11h–14h","Trabalho","work"],A=["16h–17h","Me arrumar para a faculdade","prep"],U=["19h–22h30","Faculdade (1h/1h15 de estudo)","uni"];
var S1=function(t){return ["9h30–10h45",t,"study"]},S2=function(t){return ["14h–16h",t,"study"]};
var std=function(t){t=t||"Estudos";return [G,H,S1(t),W,S2(t),A,U]};
var NEO="Estudo para a prova de neoconstitucionalismo";
var O={
"2026-11-20":{tag:["Dia de estudo","study"],b:[["Manhã","Afazeres de casa","home"],["Tarde","Estudo para a prova de empresarial","study"]]},
"2026-11-21":{tag:["Dia de estudo","study"],b:[["Dia todo","Estudo para a prova de empresarial","study"]]},
"2026-11-23":{tag:["Estudo: processo civil","study"],b:[G,H,["9h30–10h45","Livre","free"],W,["15h–20h","Estudo para a prova de processo civil","study"]]},
"2026-11-24":{tag:["Estudo: processo civil","study"],b:[G,H,["9h30–10h45","Livre","free"],W,["15h–20h","Estudo para a prova de processo civil","study"]]},
"2026-11-25":{tag:["Entrega da peça","due"],b:std()},
"2026-11-26":{tag:["Prova de processo civil","exam"],b:std("Revisão para a prova de processo civil")},
"2026-11-27":{tag:["Prova de empresarial","exam"],b:std("Revisão para a prova de empresarial")},
"2026-11-28":{tag:["Estudo: neoconstitucionalismo","study"],b:[["Manhã","Afazeres de casa","home"],["Tarde",NEO,"study"]]},
"2026-11-30":{tag:["Estudo: neoconstitucionalismo","study"],b:[G,H,S1(NEO),W,["15h–20h",NEO,"study"]]},
"2026-12-01":{tag:["Revisão: neoconstitucionalismo","review"],b:[G,H,S1("Revisão de neoconstitucionalismo"),S2("Revisão de neoconstitucionalismo"),A,U]}
};
var HOL={"2026-12-24":"Véspera de Natal","2026-12-25":"Natal","2026-12-31":"Véspera de Ano Novo","2027-01-01":"Ano Novo"};
function dec(w){
  if(w===0)return {b:[["Dia todo","Dia livre","free"]]};
  if(w===6)return {tag:["Estudo livre","review"],b:[["Dia todo","Estudo livre, revisão ou simulado","review"]]};
  if(w===5)return {b:[["7h30–10h30","Estudos","study"],W,["14h–18h","Afazeres de casa","home"]]};
  return {b:[G,["8h30–9h","Afazeres de casa","home"],["9h–10h45","Estudos","study"],W,w===3?["15h–18h","Estudos","study"]:["15h–20h","Estudos (pausa de 20 min a cada 1h)","study"]]};
}
function plan(d){
  var k=iso(d);if(ov[k])return ov[k];if(HOL[k])return {tag:[HOL[k],"free"],b:[]};if(O[k])return O[k];if(k>="2026-12-02"&&k<="2026-12-31")return dec(d.getDay());
  var w=d.getDay();
  if(w===0)return {b:[["Dia todo","Dia livre","free"]]};
  if(w===6)return {tag:["Revisão semanal","review"],b:[["Manhã","Revisão semanal","review"]]};
  return {b:std()};
}

var today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());
var mon=add(today,-((today.getDay()+6)%7));
var PRE=[
 {n:"Cronograma completo",a:"2026-11-03",b:"2026-12-31"},
 {n:"Novembro",a:"2026-11-03",b:"2026-11-30"},
 {n:"Semanas de prova",a:"2026-11-20",b:"2026-12-01"},
 {n:"Dezembro",a:"2026-12-01",b:"2026-12-31"},
 {n:"Esta semana",a:iso(mon),b:iso(add(mon,6))}
];
var de=$("#de"),ate=$("#ate"),chips=$("#chips");
PRE.forEach(function(p,i){
  var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=p.n;b.dataset.i=i;
  b.onclick=function(){apply(p.a,p.b)};chips.appendChild(b);
});

function save(a,b){try{localStorage.setItem("prumo:range",JSON.stringify({a:a,b:b}))}catch(e){}}
function apply(a,b){
  var re=/^\d{4}-\d{2}-\d{2}$/;
  if(!re.test(a)||!re.test(b))return;
  var msg="";
  if(b<a)b=a;
  if((parse(b)-parse(a))/864e5>92){b=iso(add(parse(a),92));msg="Mostrando até 93 dias por vez."}
  de.value=a;ate.value=b;$("#msg").textContent=msg;
  save(a,b);render();
}
de.onchange=function(){apply(de.value,ate.value)};
ate.onchange=function(){apply(de.value,ate.value)};

function render(){
  var a=parse(de.value),b=parse(ate.value),td=iso(today);
  var html="",wk="",n=0,ex=0,du=0,TT=0,TD=0,open=false;
  for(var d=a;d<=b;d=add(d,1)){
    var m=add(d,-((d.getDay()+6)%7)),key=iso(m);
    if(key!==wk){
      if(open)html+="</div></section>";
      wk=key;var end=add(m,6),e=end<b?end:b;
      html+='<section class="week"><h2>Semana de '+fmt(d)+" a "+fmt(e)+'</h2><div class="grid">';open=true;
    }
    var pl=plan(d),k=iso(d);n++;var dn=done[k]||[],ct=0,cd=0;pl.b.forEach(function(x,i){if(x[2]!=="free"){ct++;if(dn.indexOf(i)>-1)cd++}});TT+=ct;TD+=cd;var bar=ct?'<div class="bar" title="'+cd+' de '+ct+' feitos"><i style="width:'+Math.round(cd/ct*100)+'%"></i></div>':"";
    if(pl.tag&&pl.tag[1]==="exam")ex++;
    if(pl.tag&&pl.tag[1]==="due")du++;
    html+='<article class="day'+(k===td?" today":"")+(ov[k]?" edited":"")+'"><div class="dh"><span class="num">'+p2(d.getDate())+'</span><span class="wd">'+WD[d.getDay()]+"<br>"+MO[d.getMonth()]+(k===td?" (hoje)":"")+"</span>"+
      (pl.tag?'<span class="tag '+esc(pl.tag[1])+'">'+esc(pl.tag[0])+"</span>":"")+'<button type="button" class="eb" data-k="'+k+'">Editar</button></div>'+bar+'<div class="rows">'+
      pl.b.map(function(x,i){var c=x[2]!=="free",y=dn.indexOf(i)>-1;return '<div class="r '+esc(x[2])+(y?" done":"")+'"><span class="t">'+esc(x[0])+"</span><span>"+esc(x[1])+"</span>"+(c?'<button type="button" class="ck" data-k="'+k+'" data-i="'+i+'" aria-pressed="'+y+'" aria-label="Marcar como feito"></button>':"")+"</div>"}).join("")+"</div></article>";
  }
  if(open)html+="</div></section>";
  $("#out").innerHTML=html;
  var s=n+(n===1?" dia":" dias");
  if(ex)s+=", "+ex+(ex===1?" prova":" provas");
  if(du)s+=", "+du+(du===1?" entrega":" entregas");
  if(TT)s+=", "+TD+" de "+TT+" blocos feitos";$("#sum").textContent=s;
  Array.prototype.forEach.call(chips.children,function(c){
    var p=PRE[c.dataset.i];c.setAttribute("aria-pressed",p.a===de.value&&p.b===ate.value?"true":"false");
  });
}

var ov={},done={},db=null,uid=null,dlg=$("#dlg");try{done=JSON.parse(localStorage.getItem("prumo:done"))||{}}catch(e){done={}}
try{ov=JSON.parse(localStorage.getItem("prumo:ov"))||{}}catch(e){ov={}}
var KINDS=[["study","Estudos"],["gym","Academia"],["home","Casa"],["work","Trabalho"],["prep","Me arrumar"],["uni","Faculdade"],["review","Revisão"],["exam","Prova"],["due","Entrega"],["free","Livre"]];
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function kopt(sel){return KINDS.map(function(k){return '<option value="'+k[0]+'"'+(k[0]===sel?" selected":"")+">"+k[1]+"</option>"}).join("")}
function persist(){
  var s=JSON.stringify(ov);
  var s2=JSON.stringify(done);try{localStorage.setItem("prumo:ov",s);localStorage.setItem("prumo:done",s2)}catch(e){}
  if(db&&uid)db.collection("data/users/"+uid).doc("prumo").set({ov:s,done:s2}).catch(function(){});
}
function row(x){return '<div class="er"><input type="text" value="'+esc(x[0])+'" aria-label="Horário" placeholder="7h30–8h30"><input type="text" value="'+esc(x[1])+'" aria-label="Atividade" placeholder="Atividade"><select aria-label="Cor">'+kopt(x[2])+'</select><button type="button" class="btn" data-del="1" aria-label="Remover bloco">×</button></div>'}
function targets(k){
  if($("#sc").value!=="w")return [k];
  var o=[],a=parse(de.value),b=parse(ate.value),w=parse(k).getDay();
  for(var d=a;d<=b;d=add(d,1))if(d.getDay()===w)o.push(iso(d));
  return o;
}
function openEdit(k){
  var d=parse(k),pl=plan(d);
  dlg.innerHTML='<form class="df"><h3>Editar '+fmt(d)+", "+WD[d.getDay()]+'</h3>'+
   '<div class="er" style="grid-template-columns:1fr 108px"><input type="text" id="tg" value="'+esc(pl.tag?pl.tag[0]:"")+'" aria-label="Observação do dia" placeholder="Observação (ex.: prova)"><select id="tk" aria-label="Cor da observação">'+kopt(pl.tag?pl.tag[1]:"exam")+'</select></div>'+
   '<div id="rs" style="display:grid;gap:6px">'+pl.b.map(function(x){return row(x)}).join("")+'</div>'+
   '<button type="button" class="btn" id="ad">Adicionar bloco</button>'+
   '<label>Aplicar em<select id="sc"><option value="1">Só este dia</option><option value="w">Mesmo dia da semana em todo o período</option></select></label>'+
   '<div class="fa"><button type="button" class="btn" id="rst">Voltar ao original</button><button type="button" class="btn" id="cn">Cancelar</button><button type="button" class="btn p" id="sv">Salvar</button></div></form>';
  dlg.onclick=function(e){
    var t=e.target;
    if(t.id==="ad")$("#rs").insertAdjacentHTML("beforeend",row(["","","study"]));
    else if(t.hasAttribute&&t.hasAttribute("data-del"))t.parentNode.remove();
    else if(t.id==="cn")dlg.close();
    else if(t.id==="rst"){targets(k).forEach(function(x){delete ov[x];delete done[x]});persist();dlg.close();render()}
    else if(t.id==="sv"){
      var b=[].map.call(document.querySelectorAll("#rs .er"),function(r){var i=r.querySelectorAll("input,select");return [i[0].value.trim(),i[1].value.trim(),i[2].value]}).filter(function(x){return x[0]||x[1]});
      var tg=$("#tg").value.trim(),n={b:b};
      if(tg)n.tag=[tg,$("#tk").value];
      targets(k).forEach(function(x){ov[x]=JSON.parse(JSON.stringify(n));delete done[x]});
      persist();dlg.close();render();
    }
  };
  dlg.showModal();
}
dlg.onsubmit=function(e){e.preventDefault()};
$("#out").onclick=function(e){var t=e.target;if(!t.closest)return;var b=t.closest(".eb");if(b){openEdit(b.dataset.k);return}var c=t.closest(".ck");if(c){var k=c.dataset.k,i=+c.dataset.i,a=done[k]||[],j=a.indexOf(i);if(j>-1)a.splice(j,1);else a.push(i);if(a.length)done[k]=a;else delete done[k];persist();render()}};
function cloud(){
  if(!(window.claude&&claude.use))return;
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    if(!r[0]||!r[1])return;
    return r[1].id().then(function(id){
      if(!id)return;
      db=r[0];uid=id;
      return db.collection("data/users/"+uid).doc("prumo").get().then(function(s){
        if(s.exists){ov=JSON.parse(s.data().ov)||{};done=JSON.parse(s.data().done||"{}")||{};try{localStorage.setItem("prumo:ov",JSON.stringify(ov))}catch(e){}render()}
        else if(Object.keys(ov).length)persist();
      });
    });
  }).catch(function(){});
}

try{var v=JSON.parse(localStorage.getItem("prumo:range"));if(v&&v.a&&v.b){a0=v.a;b0=v.b}}catch(e){}
apply(a0,b0);cloud();
})();
</script>
